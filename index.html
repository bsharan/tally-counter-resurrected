<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a2e1e">
  <meta name="description" content="One-click tally counter with night-check for bill-less small shops.">
  <title>Tally Counter</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f7f3ee;
      --surface: #fffdf9;
      --accent: #7a2e1e;
      --accent-soft: #a8553f;
      --ink: #2b1d14;
      --ink-soft: #8a7565;
      --line: #e8dfd5;
      --ok: #2e7d32;
      --short: #c62828;
      --over: #ef6c00;
      --tap: 56px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--ink);
      font-family: 'Noto Sans', 'Noto Sans Telugu', system-ui, sans-serif;
      font-size: 17px; line-height: 1.45;
    }
    body { max-width: 560px; margin: 0 auto; min-height: 100vh; }

    /* ---- header ---- */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; padding-top: max(14px, env(safe-area-inset-top));
      background: var(--accent); color: #fff;
    }
    .brand { display: flex; align-items: baseline; gap: 8px; }
    .app-title { font-size: 1.2rem; margin: 0; font-weight: 700; }
    .app-subtitle { font-size: 0.75rem; opacity: 0.8; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.15); border: none; border-radius: 50%;
      color: #fff; cursor: pointer; padding: 0;
    }
    .icon-btn:active { background: rgba(255,255,255,0.3); }
    .icon-btn svg { width: 20px; height: 20px; }
    .lang-toggle {
      background: rgba(255,255,255,0.15); border: none;
      color: #fff; border-radius: 999px; padding: 8px 16px;
      font-size: 0.85rem; font-weight: 600; min-height: 36px; cursor: pointer;
      font-family: inherit;
    }
    .lang-toggle:active { background: rgba(255,255,255,0.3); }

    main { padding: 18px 18px 56px; }

    /* ---- views ---- */
    .view { display: flex; flex-direction: column; gap: 16px; }
    .view[hidden] { display: none; }
    .view-title {
      font-size: 1.05rem; font-weight: 600; margin: 0;
      color: var(--ink);
    }

    /* ---- expected cash (main screen hero) ---- */
    .expected-bar {
      display: flex; flex-direction: column; gap: 2px;
      padding: 4px 0 8px;
    }
    .expected-label { font-size: 0.85rem; color: var(--ink-soft); }
    .expected-amount {
      font-size: 2.6rem; font-weight: 800; color: var(--accent);
      line-height: 1.1;
    }

    /* ---- item grid ---- */
    .item-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;
    }
    .item-btn {
      display: flex; flex-direction: column; align-items: stretch; gap: 4px;
      background: var(--surface); border: none; border-radius: 16px;
      padding: 18px 14px; min-height: var(--tap); cursor: pointer;
      font-family: inherit; text-align: center; color: var(--ink);
      transition: background 0.1s, transform 0.05s;
    }
    .item-btn:active { background: #f0e6db; transform: scale(0.97); }
    .item-name { font-size: 1.15rem; font-weight: 600; }
    .item-price { font-size: 0.85rem; color: var(--ink-soft); }
    .item-count {
      align-self: center; margin-top: 4px;
      background: var(--accent); color: #fff; border-radius: 999px;
      min-width: 28px; padding: 2px 12px; font-weight: 700; font-size: 0.95rem;
    }

    /* ---- main actions row ---- */
    .main-actions {
      display: flex; align-items: center; gap: 12px;
    }
    .undo-btn {
      min-height: 44px; border: none; background: transparent;
      color: var(--accent); font-weight: 600; font-size: 0.95rem;
      cursor: pointer; font-family: inherit; padding: 0 4px;
    }
    .undo-btn:active { color: var(--accent-soft); }
    .undo-btn:disabled { color: var(--ink-soft); opacity: 0.5; cursor: default; }
    .sales-summary { font-size: 0.85rem; color: var(--ink-soft); }

    .primary-btn {
      min-height: var(--tap); border: none; border-radius: 14px;
      background: var(--accent); color: #fff; font-weight: 600; font-size: 1.05rem;
      cursor: pointer; font-family: inherit; padding: 0 20px;
    }
    .primary-btn:active { background: var(--accent-soft); }

    .back-btn {
      min-height: 48px; border: none; background: transparent;
      color: var(--accent); font-weight: 600; font-size: 0.95rem;
      cursor: pointer; font-family: inherit; text-align: left; padding: 0;
    }
    .back-btn:active { color: var(--accent-soft); }

    /* ---- night check ---- */
    .nc-field { display: flex; flex-direction: column; gap: 6px; }
    .nc-field label { font-size: 0.9rem; color: var(--ink-soft); }
    .rupee-input {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border-radius: 12px; padding: 0 14px;
    }
    .rupee-input span { font-size: 1.1rem; color: var(--ink-soft); }
    .rupee-input input {
      flex: 1; min-height: var(--tap); border: none; background: transparent;
      font-size: 1.2rem; font-family: inherit; color: var(--ink); outline: none;
    }

    /* ---- verdict ---- */
    .verdict {
      background: var(--surface); border-radius: 16px; padding: 18px 20px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .verdict-status { font-size: 1.4rem; font-weight: 700; }
    .verdict-status.ok { color: var(--ok); }
    .verdict-status.short { color: var(--short); }
    .verdict-status.over { color: var(--over); }
    .verdict-grid { display: flex; flex-direction: column; gap: 8px; font-size: 0.95rem; }
    .verdict-grid .vrow { display: flex; justify-content: space-between; gap: 16px; }
    .verdict-grid .vlabel { color: var(--ink-soft); }
    .verdict-grid .vval { font-weight: 600; }

    /* ---- settings / edit items ---- */
    .edit-list { display: flex; flex-direction: column; gap: 10px; }
    .edit-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border-radius: 12px; padding: 10px 14px;
    }
    .edit-row input {
      min-height: 44px; border: none; background: transparent;
      font-size: 1rem; font-family: inherit; color: var(--ink);
      border-bottom: 1px solid var(--line); border-radius: 0; padding: 4px 0;
    }
    .edit-row input:focus { outline: none; border-bottom-color: var(--accent); }
    .edit-row .e-name { flex: 1; min-width: 0; }
    .edit-row .e-price { width: 70px; text-align: right; }
    .edit-row .remove-btn {
      min-height: 40px; min-width: 40px; border: none; border-radius: 10px;
      background: transparent; color: var(--short); font-size: 0.85rem;
      cursor: pointer; font-family: inherit; padding: 0 10px;
    }
    .edit-row .remove-btn:active { background: rgba(198,40,40,0.08); }

    .add-item-form {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch;
    }
    .add-item-form input {
      min-height: var(--tap); border: none; background: var(--surface);
      border-radius: 12px; padding: 0 14px; font-size: 1rem;
      font-family: inherit; color: var(--ink);
    }
    .add-item-form input:focus { outline: 2px solid var(--accent-soft); }
    .add-item-form .ai-name { flex: 1; min-width: 100px; }
    .add-item-form .ai-price { width: 90px; }
    .add-item-form .ai-btn {
      min-height: var(--tap); border: none; border-radius: 12px;
      background: var(--accent); color: #fff; font-weight: 600;
      font-size: 0.95rem; cursor: pointer; font-family: inherit;
      padding: 0 20px; flex: 1; min-width: 100px;
    }
    .add-item-form .ai-btn:active { background: var(--accent-soft); }

    .flash-err {
      flex-basis: 100%; color: var(--short); font-size: 0.85rem;
    }

    footer {
      text-align: center; font-size: 0.72rem; color: var(--ink-soft);
      padding: 20px; opacity: 0.6;
    }

    @media (max-width: 360px) {
      body { font-size: 16px; }
      .item-grid { gap: 10px; }
      .expected-amount { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1 id="title" class="app-title"></h1>
      <span id="subtitle" class="app-subtitle"></span>
    </div>
    <div class="header-actions">
      <button id="gearBtn" class="icon-btn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button id="langToggle" class="lang-toggle" type="button" aria-label="Switch language"></button>
    </div>
  </header>

  <main>
    <!-- ============ MAIN VIEW ============ -->
    <div id="view-main" class="view">
      <div class="expected-bar">
        <span id="expectedLabel" class="expected-label"></span>
        <span id="expectedAmount" class="expected-amount">&#8377;0</span>
      </div>
      <div id="itemGrid" class="item-grid" role="group" aria-label="Items"></div>
      <div class="main-actions">
        <button id="undoBtn" class="undo-btn" type="button"></button>
        <span id="salesSummary" class="sales-summary"></span>
      </div>
      <button id="closeDayBtn" class="primary-btn" type="button"></button>
    </div>

    <!-- ============ NIGHT CHECK VIEW ============ -->
    <div id="view-nightcheck" class="view" hidden>
      <h2 id="nightCheckTitle" class="view-title"></h2>
      <div class="nc-field">
        <label id="upiLabel" for="upiTotal"></label>
        <div class="rupee-input">
          <span>&#8377;</span>
          <input id="upiTotal" type="number" min="0" step="0.01" inputmode="decimal"
                 placeholder="0" autocomplete="off">
        </div>
      </div>
      <div class="nc-field">
        <label id="cashLabel" for="cashTotal"></label>
        <div class="rupee-input">
          <span>&#8377;</span>
          <input id="cashTotal" type="number" min="0" step="0.01" inputmode="decimal"
                 placeholder="0" autocomplete="off">
        </div>
      </div>
      <button id="checkBtn" class="primary-btn" type="button"></button>
      <div id="verdictDisplay" class="verdict" hidden></div>
      <button id="nightBackBtn" class="back-btn" type="button"></button>
    </div>

    <!-- ============ SETTINGS VIEW ============ -->
    <div id="view-settings" class="view" hidden>
      <h2 id="settingsTitle" class="view-title"></h2>
      <div id="editList" class="edit-list"></div>
      <form id="addItemForm" class="add-item-form">
        <input id="newItemName" class="ai-name" type="text" autocomplete="off">
        <input id="newItemPrice" class="ai-price" type="number" min="0" step="1" inputmode="numeric">
        <button id="addItemBtn" class="ai-btn" type="submit"></button>
      </form>
      <button id="settingsBackBtn" class="back-btn" type="button"></button>
    </div>
  </main>

  <footer>Tally Counter, Resurrected &middot; MIT</footer>

  <script src="src/logic.js"></script>
  <script src="src/i18n.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
